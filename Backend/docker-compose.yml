services:
  postgres:
    image: postgres:16-alpine
    container_name: zovryn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zovryn_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zovryn_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zovryn_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=zovryn_db;Username=postgres;Password=${DB_PASSWORD:-postgres}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ZovrynAPI
      Jwt__Audience: ZovrynApp
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
